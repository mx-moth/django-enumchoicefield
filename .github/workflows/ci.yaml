name: Test
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.*"
  pull_request:
    branches:
      - "*"

  workflow_dispatch:

env:
  python-version: "3.14"

jobs:
  test-matrix:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "5.2"

          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "6.0"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install
        shell: bash -l {0}
        run: |
          pip install -e.[testing] "Django~=${DJANGO_VERSION}"
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}

      - name: Test
        shell: bash -l {0}
        run: |
          ./runtests.py

  lint:
    name: Lint and docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.python-version }}
          cache: 'pip'

      - name: Install
        shell: bash -l {0}
        run: |
          pip install -e.[testing,docs]
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}

      - name: Lint
        shell: bash -l {0}
        run: |
          ruff check enumchoicefield/

      - name: Docs
        shell: bash -l {0}
        run: |
          cd ./docs
          make SPHINXOPTS=-nW clean html
